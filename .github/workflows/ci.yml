name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
env:
  PYTHONUTF8: '1'
  MT5_ENABLED: 'false'
  MT5_LOCAL_FILES_ONLY: 'true'
  ALLOW_RULE_BASED_FALLBACK: 'true'
jobs:
  portable:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      SECRET_KEY: ci-only-secret-000000000000000000000000000000000000
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app ml_training tests alembic scripts
      - run: python -m ruff format --check app ml_training tests alembic scripts
      - run: python -m pytest -q --basetemp=.pytest-tmp
      - run: python -m pip check
      - run: python scripts/audit_dependencies.py
        if: runner.os == 'Linux'
  postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fluilet_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fluilet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U fluilet_test -d fluilet_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-000000000000000000000000000000000000
      DATABASE_URL: postgresql+psycopg://fluilet_test:ci-only-password@127.0.0.1:5432/fluilet_test
      TEST_DATABASE_URL: postgresql+psycopg://fluilet_test:ci-only-password@127.0.0.1:5432/fluilet_test
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip check
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q --basetemp=.pytest-tmp
