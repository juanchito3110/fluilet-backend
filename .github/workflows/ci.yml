name: Backend verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  portable:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      SECRET_KEY: ci-only-secret-000000000000000000000000000000000000
      DATABASE_URL: postgresql+psycopg://ci:ci@127.0.0.1:1/unused
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: ruff check app ml_training tests alembic scripts
      - run: ruff format --check app ml_training tests alembic scripts
      - run: python -m pytest -q --basetemp=.pytest-tmp
      - run: python -m pip check
      - run: python scripts/audit_dependencies.py
        if: runner.os == 'Linux'
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: fluilet_test
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: fluilet_test
        ports: ['5432:5432']
        options: >-
          --health-cmd 'pg_isready -U fluilet_test -d fluilet_test'
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SECRET_KEY: ci-only-secret-000000000000000000000000000000000000
      DATABASE_URL: postgresql+psycopg://fluilet_test:ci-only-password@127.0.0.1:5432/fluilet_test
      TEST_DATABASE_URL: postgresql+psycopg://fluilet_test:ci-only-password@127.0.0.1:5432/fluilet_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m alembic upgrade head
      - run: python -m alembic check
      - run: python -m pytest -q --basetemp=.pytest-tmp
