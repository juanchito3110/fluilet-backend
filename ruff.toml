target-version = "py312"
line-length = 100
exclude = ["venv", ".venv", ".test-postgres", ".pip-tmp", ".pytest-tmp"]

[lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[lint.isort]
known-third-party = ["datasets", "torch", "transformers", "peft", "yaml"]

[lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "app.auth.require_roles"]

[lint.per-file-ignores]
"tests/conftest.py" = ["E402"]
