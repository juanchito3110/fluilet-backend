# Native nginx/systemd deployment on 67.205.150.186 (not the Compose proxy).
# Keep HTTP for Android 1.0. Do not add redirects or HSTS to either server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name 67.205.150.186 _;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/fluilet-error.log crit;
    client_max_body_size 5m;
    client_body_timeout 15s;
    client_body_in_file_only off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name 67.205.150.186 _;
    ssl_certificate /etc/letsencrypt/live/fluilet-ip/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fluilet-ip/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:FluiletTLS:1m;
    ssl_session_timeout 1d;
    server_tokens off;
    access_log off;
    error_log /var/log/nginx/fluilet-error.log crit;
    client_max_body_size 5m;
    client_body_timeout 15s;
    client_body_in_file_only off;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control no-store always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_connect_timeout 5s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
}
